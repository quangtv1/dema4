<body>
<div id="app"></div>
<div id="tip"></div>
<script>
'use strict';
/* =========================================================================
   Prototype màn Xóa ghim (dema4). Dữ liệu, tên file và văn bản đều là mẫu giả.
   Vùng lưu theo tỉ lệ trang (0..1) như app: x, y, w, h.
   ========================================================================= */
const BLUE = '#2563eb';
const SRC = 'D:/Ho_so_mau/Lo_01';
const PAGES = [7,10,2,3,6,2,3,18,2,3,1,1,1,4,2,2,3,2];
const MAX_PAGES = 8;   // số trang vẽ ra trong prototype
const TEN_GOC  = {tl:'Góc trên trái', tr:'Góc trên phải', bl:'Góc dưới trái', br:'Góc dưới phải'};
const TEN_CANH = {t:'Cạnh trên', b:'Cạnh dưới', l:'Cạnh trái', r:'Cạnh phải'};

function hinhGoc(k){ const w=.14,h=.09; return {x:k[1]==='l'?0:1-w, y:k[0]==='t'?0:1-h, w, h}; }
function hinhCanh(k){ return k==='t'?{x:0,y:0,w:1,h:.06}:k==='b'?{x:0,y:.94,w:1,h:.06}:k==='l'?{x:0,y:0,w:.06,h:1}:{x:.94,y:0,w:.06,h:1}; }
// Vùng cạnh chỉ kéo được mép trong (bề dày); mép ngoài bám cạnh trang, chiều dài luôn hết trang
const MEP_TRONG = {t:'s', b:'n', l:'e', r:'w'};
const laCanh = z => z.src==='canh';
const canhDoc = z => z.key==='l'||z.key==='r';   // cạnh dọc: chỉnh Rộng; cạnh ngang: chỉnh Cao

let nextId = 3;
// Khổ + chiều từng trang (mẫu giả): phần lớn A4 dọc; vài file có trang A3 ngang (bản vẽ, bảng biểu) hoặc A5
function metaTrang(i,p){
  const m=[]; for(let t=1;t<=p;t++){
    let size='A4', ori='doc';
    if ((i%4===1 && t%3===0) || (i===7 && t>12)) { size='A3'; ori='ngang'; }
    else if (i%6===4 && t===p) { size='A5'; ori='ngang'; }
    m.push({size, ori});
  } return m;
}
// "1-3, 7, >10, <5" → hàm kiểm tra số
function khopSo(txt){
  const ps=txt.split(',').map(x=>x.trim()).filter(Boolean); if(!ps.length) return null;
  const fs=ps.map(x=>{ let m;
    if ((m=x.match(/^(\d+)\s*-\s*(\d+)$/))) return n=>n>=+m[1]&&n<=+m[2];
    if ((m=x.match(/^>=?\s*(\d+)$/))) return x.includes('=')?n=>n>=+m[1]:n=>n>+m[1];
    if ((m=x.match(/^<=?\s*(\d+)$/))) return x.includes('=')?n=>n<=+m[1]:n=>n<+m[1];
    if ((m=x.match(/^(\d+)$/))) return n=>n===+m[1];
    return null; }).filter(Boolean);
  return fs.length ? n=>fs.some(f=>f(n)) : null;
}
// File có ít nhất 1 trang (trong dải trang) khớp khổ + chiều đã chọn
function khopNangCao(f, a){
  const trong = khopSo(a.range||''); const sizes=Object.keys(a.sizes).filter(k=>a.sizes[k]);
  return f.meta.some((m,i)=>(!trong||trong(i+1)) && sizes.includes(m.size) && (m.ori==='ngang'?a.ngang:a.doc));
}
const S = {
  menu:null, cfg:false, ctx:null, confirm:null, home:false, run:null, help:false, toast:'',
  motFile:false, outDir:null, outMode:'nhanBan',   // outMode: 'nhanBan' = nhân bản cây thư mục gốc sang thư mục đích; 'canh' = ghi cạnh file gốc
  listUser:null, listW:282,   // listW: độ rộng cột Danh sách (kéo mép phải; 200–520px)
    // null = mặc định (mở rộng); true/false = người dùng đã bấm   // motFile: mở 1 file PDF; outDir: thư mục đích người dùng chọn (null = mặc định <nguồn>_xoaghim)
  // Mô hình AI nhận diện layout: chưa có → tải 1 lần (37,5 MB) → kiểm SHA-256 → sẵn sàng
  model:{st:'none', p:0},
  cv:{netDen:true, doXanh:true, dpi:'Gốc', nen:'90%', denTrang:false, nenTrang:false, ghiDe:false, render10:true, tuLuu:0, cuonCung:true}, collapsed:false, opened:false, hideDich:false, thumbs:true,
  loc:'all', draw:null, nhanDien:false, updating:false,
  files: PAGES.map((p,i)=>({name:'HS_'+String(i+1).padStart(3,'0')+'.pdf', pages:p, checked:true, st:(i===11?'lost':i%7===3?'stale':i%3===0?'done':'todo'), meta:metaTrang(i,p)})),
  sel:0, filter:'', pgFilter:'', stFilter:'all', sortBy:'name', desc:false, advOpen:false, advOn:true,   // Lọc nâng cao: mặc định thu gọn, chỉ mở khi người dùng bấm
  // Lọc nâng cao: phần đang sửa (adv) và phần đã Áp dụng (advAp)
  adv:{sizes:{A0:false,A1:false,A2:false,A3:true,A4:true,A5:false,A6:false,A7:false}, ngang:true, doc:true, range:''},
  advAp:null,
  zoom:'fitW', view:'lien', page:1,
  zones:[
    Object.assign({id:1, kind:'xoa', src:'goc', key:'tl', pages:'all', ng:5}, hinhGoc('tl')),
    Object.assign({id:2, kind:'xoa', src:'canh', key:'l', pages:'all', ng:5}, hinhCanh('l'))
  ],
  zsel:1, selIds:[1], undo:[]
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const zoneById = id => S.zones.find(z=>z.id===id);
function lines(seed, n){ const out=[]; let x=seed*9301+49297; for(let i=0;i<n;i++){ x=(x*9301+49297)%233280; out.push(i===n-1?35+(x%50):92+(x%9)); } return out; }
const bars = ws => ws.map(w=>`<div class="bar" style="width:${w}%"></div>`).join('');
const svgChevL = '<svg width="8" height="8" viewBox="0 0 8 8"><path d="M6 0L1 4l5 4z" fill="#555"/></svg>';
const svgChevR = '<svg width="8" height="8" viewBox="0 0 8 8"><path d="M2 0l5 4-5 4z" fill="#555"/></svg>';

/* ---------- vùng: tên, phạm vi trang, hoàn tác ---------- */
function tenVung(z){
  if (z.src==='goc') return TEN_GOC[z.key];
  if (z.src==='canh') return TEN_CANH[z.key];
  const cung = S.zones.filter(v=>v.src==='ve' && v.kind===z.kind && !!v.vodoi===!!z.vodoi);
  return (z.vodoi?'Vô đối ':z.kind==='xoa'?'Xóa ':'Bảo vệ ') + (cung.indexOf(z)+1);
}
const tenPham = p => p==='all'?'mọi trang':p==='le'?'trang lẻ':p==='chan'?'trang chẵn':'trang '+p;

function xoaIds(bo){
  luuHoanTac(); S.zones=S.zones.filter(z=>!bo.includes(z.id)); chon(S.selIds.filter(id=>!bo.includes(id))); nhayCapNhat();
}
// Như app: đổi vùng thì khung Đích báo "đang cập nhật…" một nhịp rồi vẽ lại
let tUpd=null, tToast=null;
function baoNhanh(t){ S.toast=t; clearTimeout(tToast); tToast=setTimeout(()=>{ S.toast=''; render(); }, 2400); }
function nhayCapNhat(){ S.files.forEach(f=>{ if (f.st==='done') f.st='stale'; }); S.updating=true; clearTimeout(tUpd); tUpd=setTimeout(()=>{ S.updating=false; render(); }, 350); }
// Phạm vi trang của vùng góc / cạnh mới theo cột lọc trang
const phamViMoi = no => S.loc==='le'?'le':S.loc==='chan'?'chan':(S.loc==='tung'||S.loc==='vodoi')?no:'all';

function batTatGoc(src, key){
  luuHoanTac();
  const co = S.zones.find(z=>z.src===src && z.key===key);
  if (co){ S.zones=S.zones.filter(z=>z!==co); chon(S.selIds.filter(id=>id!==co.id)); }
  else { const z=Object.assign({id:nextId++, kind:'xoa', src, key, pages:phamViMoi(S.page), ng:5}, src==='goc'?hinhGoc(key):hinhCanh(key)); S.zones.push(z); chon([z.id]); }

}

const TEN_ST = {all:'Tất cả', can:'Cần chạy', todo:'Chưa xóa', done:'Đã xóa', stale:'Đã đổi vùng', lost:'Mất kết quả'};

  stale:['<svg width="11" height="11" viewBox="0 0 11 11"><path d="M9 4.2A3.8 3.8 0 1 0 9.3 7" fill="none" stroke="#d97706" stroke-width="1.5"/><path d="M9.5 1.5v3h-3" fill="none" stroke="#d97706" stroke-width="1.5"/></svg>','Đã xoá nhưng vùng / tuỳ chọn đã đổi — sẽ chạy lại'],
  lost: ['<svg width="11" height="11" viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4.6" fill="#dc2626"/><path d="M5.5 2.8v3.3" stroke="#fff" stroke-width="1.4"/><circle cx="5.5" cy="8" r=".8" fill="#fff"/></svg>','File kết quả không còn / bị thay — sẽ chạy lại']
};
const canChay = f => f.checked && f.st!=='done';
const MUC = ['Phần I: Kết quả thực hiện nhiệm vụ','I. NHỮNG THUẬN LỢI, KHÓ KHĂN','Phần II: Phương hướng nhiệm vụ','II. GIẢI PHÁP THỰC HIỆN'];

// Vết ghim, lỗ dập, vết bẩn mép trang: có ở cả bản quét Gốc lẫn Đích (Đích phủ trắng ở vùng xoá)
function vetBan(no){

  return `<svg class="stain" width="70" height="60" viewBox="0 0 70 60" style="left:10px;top:8px"><path d="M14 40L44 12" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round"/><path d="M10 44l6-2M42 10l5-1" stroke="#666" stroke-width="2"/><circle cx="30" cy="48" r="1.4" fill="#555"/><circle cx="52" cy="30" r="1.1" fill="#555"/></svg>

    ${odd?'':`<svg class="stain" width="60" height="22" viewBox="0 0 60 22" style="right:24px;bottom:14px"><path d="M2 14c12-9 30-11 56-4" fill="none" stroke="#8b8b8b" stroke-width="2.4" stroke-linecap="round" opacity=".6"/></svg>`}`;
}
function zoneHtml(z){

}
function coverHtml(z){ return `<div class="cov ${z.vodoi?'vd':''}" data-z="${z.id}" style="left:${z.x*100}%;top:${z.y*100}%;width:${z.w*100}%;height:${z.h*100}%"></div>`; }

    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-top:2px"><span class="${t}" style="padding:1px 4px">Số: …/BC-MẪU</span><i class="${t}" style="padding:1px 4px">Địa danh, ngày … tháng … năm …</i></div>

    <div class="${t}" style="align-self:center;font-size:12.5px;font-weight:700;padding:1px 6px;margin:4px 0">Kính gửi: Đơn vị mẫu cấp trên</div>
    <div style="display:flex;flex-direction:column;gap:3px;font-size:13.5px;line-height:1.28">${blocks.join('')}</div>

// zoom: số % cố định, hoặc 'fitW' (vừa bề ngang khung) / 'fitH' (cả trang vừa chiều cao khung)
function zoomNow(){
  if (typeof S.zoom==='number') return S.zoom;
  if (!S.opened) return 100;
  const v=document.getElementById('vGoc'); const w=v?v.clientWidth:600, h=v?v.clientHeight:700;
  return S.zoom==='fitH' ? Math.max(20, Math.floor((h-24)/842*1000)/10) : Math.max(20, Math.floor((w-24)/595*1000)/10);
}
// Chuyển tới trang: Liên tiếp = cuộn tới trang; Từng trang = chỉ hiện trang đó

function nutChay(){
  const ds = S.motFile ? [S.files[S.sel]] : S.files;
  const n = S.opened ? ds.filter(canChay).length : 0, tat = S.opened ? ds.filter(f=>f.checked).length : 0;

  return `<div class="row" style="gap:1px;position:relative">
    <button class="run" style="height:28px;border-radius:3px 0 0 3px" data-act="run" ${n?'':'disabled'} title="${goiY}"><svg width="9" height="10" viewBox="0 0 9 10"><path d="M1 1l7 4-7 4z" fill="#fff"/></svg><span>Xóa ghim${S.opened?' ('+n+')':''}</span></button>
    <button class="run" style="height:28px;padding:0 8px;border-radius:0 3px 3px 0" data-act="runMenu" ${tat?'':'disabled'} aria-label="Tuỳ chọn chạy">${IC.caret.replace('#444','#fff')}</button>
    ${S.menu==='run'?`<div class="drop" style="left:auto;right:0;top:auto;bottom:100%;margin-bottom:4px">${dit('Chạy lại mọi file đã tick ('+tat+')','runAll')}</div>`:''}</div>`;
}
let tChay=null;
function batDauChay(tatCa){
  const ds=(S.motFile?[S.sel]:S.files.map((f,i)=>i)).filter(i=>tatCa?S.files[i].checked:canChay(S.files[i]));
  if (!ds.length) return;
  S.run={st:'chay', ds, i:0, trang:0, t0:Date.now()}; S.menu=null; render();
  clearInterval(tChay);
  tChay=setInterval(()=>{ const r=S.run; if(!r||r.st!=='chay'){ clearInterval(tChay); return; }
    const f=S.files[r.ds[r.i]]; f.st='done'; r.trang+=f.pages; r.i++;
    if (r.i>=r.ds.length){ r.st='xong'; r.giay=((Date.now()-r.t0)/1000).toFixed(1); clearInterval(tChay); }
    render(); }, 380);
}
function runHtml(){
  const r=S.run; if(!r) return '';
  const n=r.ds.length, pc=Math.round(r.i/n*100), dang=r.st==='chay';
  const ten = dang ? S.files[r.ds[Math.min(r.i,n-1)]].name : '';
  return `<div class="modal"><div class="dlg" style="width:460px">
    <div class="row" style="height:42px;padding:0 16px;border-bottom:1px solid #e3e5e8;font-weight:600">${dang?'Đang xoá ghim…':r.st==='dung'?'Đã dừng':'Xoá ghim xong'}</div>

      <div style="height:8px;border-radius:4px;background:#e5e7eb;overflow:hidden"><div style="height:100%;width:${pc}%;background:${r.st==='xong'?'#16a34a':'#2563eb'};transition:width .2s"></div></div>
      <div class="row"><span>${r.i} / ${n} file · ${r.trang} trang</span><div class="grow"></div><span class="muted">${pc}%</span></div>
      ${dang?`<span class="muted" style="font-size:12px">${esc(ten)}</span>`:`<span class="muted" style="font-size:12px">${r.st==='xong'?'Kết quả ở: '+esc(S.motFile?fileDich(S.files[S.sel].name):S.outMode==='canh'?'cạnh từng file gốc':thuMucRa())+' · '+r.giay+' giây':'Các file chưa chạy giữ nguyên trạng thái.'}</span>`}

  </div></div>`;
}
function footHtml(){
  const nC=S.files.filter(f=>f.checked).length;
  const n=S.opened?soTrang():0;
  const chung=S.zones.filter(z=>z.src!=='ve').length, rieng=S.zones.filter(z=>z.src==='ve').length;
  const on = k => S.zoom===k ? 'style="background:#dbe7fb;border-color:#93b4ea"' : '';
  const zs=[25,41,50,55,70,85,100,125,150];
  const cur=zoomNow();
  return `<div class="row foot" style="gap:6px">

let tTai=null;
function taiMoHinh(){
  S.model={st:'loading', p:0}; clearInterval(tTai);
  tTai=setInterval(()=>{ S.model.p=Math.min(100, S.model.p+3+Math.random()*4);
    if (S.model.p>=100){ clearInterval(tTai); S.model={st:'verify', p:100}; render(); setTimeout(()=>{ S.model={st:'ready', p:100}; S.nhanDien=true; render(); }, 700); return; }
    if (S.cfg) render(); }, 110);
}

      <div class="col grow">${toolsHtml()}${viewsHtml()}${footHtml()}</div>
    </div></div>${cfgHtml()}${ctxHtml()}${confirmHtml()}${helpHtml()}${runHtml()}${S.toast?`<div style="position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:7px 14px;border-radius:6px;font-size:12.5px;z-index:70">${esc(S.toast)}</div>`:''}`;

function apTyLe(){
  if (typeof S.zoom==='number' || !S.opened) return;
  const z=zoomNow();
  document.querySelectorAll('.pz').forEach(el=>{ el.style.zoom=z/100; });
  const o=document.querySelector('[data-sel=zoom] option[value=""]'); if(o) o.textContent=Math.round(z)+'%';
}
function veSlider(el){
  el.style.setProperty('--p', ((el.value-el.min)/(el.max-el.min)*100)+'%');
  const n=document.querySelector(`[data-num="${el.dataset.range}"]`); if(n && document.activeElement!==n) n.value=el.value;
}
/* Cập nhật vị trí 1 vùng trên mọi trang (Gốc + lớp phủ Đích) mà không vẽ lại cả màn — để kéo mượt */
function capNhatDom(z){
  document.querySelectorAll(`[data-z="${z.id}"]`).forEach(el=>{
    el.style.left=z.x*100+'%'; el.style.top=z.y*100+'%'; el.style.width=z.w*100+'%'; el.style.height=z.h*100+'%';
  });
  if (z.id===S.zsel){
    const r=document.querySelector('[data-range=rong]'), c=document.querySelector('[data-range=cao]');
    if (r){ r.value=Math.round(z.w*100); veSlider(r); }
    if (c){ c.value=Math.round(z.h*100); veSlider(c); }
  }
}
// Vị trí trang trong khung cuộn (đo bằng toạ độ màn hình — offsetTop sai khi trang có zoom)
const viTriTrong = (el, v) => el.getBoundingClientRect().top - v.getBoundingClientRect().top + v.scrollTop;
function cuonToiTrang(no){ const el=document.querySelector(`#vGoc .pz[data-p="${no}"]`), v=document.getElementById('vGoc'); if(el&&v) v.scrollTop=viTriTrong(el,v)-6; }

/* ---------- chuột: chọn / kéo / đổi cỡ / vẽ vùng ---------- */
const app=document.getElementById('app'), tip=document.getElementById('tip');
let drag=null;
const MIN = .015;
function viTri(e, no){
  const d=document.querySelector(`.goc .doc[data-p="${no}"]`); const r=d.getBoundingClientRect();
  return {fx:clamp((e.clientX-r.left)/r.width,0,1), fy:clamp((e.clientY-r.top)/r.height,0,1)};
}
app.addEventListener('mousedown', e=>{
  if (e.button!==0) return;
  const doc=e.target.closest('.goc .doc'); if(!doc || S.ctx) return;
  const no=+doc.dataset.p, p=viTri(e,no);
  const h=e.target.closest('.h'), zEl=e.target.closest('.z');
  if (S.draw){
    luuHoanTac();
    const z={id:nextId++, kind:S.draw, src:'ve', key:null, x:p.fx, y:p.fy, w:0, h:0, ng:5,
      pages: S.loc==='le'?'le':S.loc==='chan'?'chan':S.loc==='all'?'all':no, vodoi: S.draw==='xoa' && S.loc==='vodoi'};
    S.zones.push(z); chon([z.id]); render();
    drag={t:'new', id:z.id, no, x0:p.fx, y0:p.fy};
  } else if (zEl){
    const id=+zEl.dataset.z, z=zoneById(id);
    if (e.shiftKey){ chon(S.selIds.includes(id) ? S.selIds.filter(v=>v!==id) : [...S.selIds, id]); render(); e.preventDefault(); return; }
    if (S.selIds.includes(id) && S.selIds.length>1 && !h){
      // kéo cả nhóm đang chọn (vùng cạnh đứng yên)
      luuHoanTac();
      const ids=S.selIds.filter(v=>{ const q=zoneById(v); return q && !laCanh(q); });
      drag={t:'mvg', ids, no, p0:p, o:Object.fromEntries(ids.map(v=>{const q=zoneById(v); return [v,{x:q.x,y:q.y}];})), moved:false};
    } else {
      chon([id]); luuHoanTac();
      drag={t:h?'rs':(laCanh(z)?'none':'mv'), h:h&&h.dataset.h, id, no, p0:p, o:{x:z.x,y:z.y,w:z.w,h:z.h}, moved:false};
      document.querySelectorAll('.z.sel').forEach(el=>el.classList.remove('sel'));
      document.querySelectorAll(`.z[data-z="${id}"]`).forEach(el=>el.classList.add('sel'));
      document.querySelector('.win').classList.remove('multi');
    }
  } else {
    // quét khung chọn như AutoCAD: kéo sang phải = Window (nằm trọn), sang trái = Crossing (chạm vào)
    const b=document.createElement('div'); b.className='box win'; doc.appendChild(b);
    drag={t:'box', no, x0:p.fx, y0:p.fy, el:b, add:e.shiftKey, moved:false};
  }
  e.preventDefault();
});
window.addEventListener('mousemove', e=>{
  if (!drag) return;
  const p=viTri(e,drag.no);
  if (drag.t==='box'){
    const x=Math.min(drag.x0,p.fx), y=Math.min(drag.y0,p.fy), w=Math.abs(p.fx-drag.x0), h=Math.abs(p.fy-drag.y0);
    Object.assign(drag.el.style,{left:x*100+'%',top:y*100+'%',width:w*100+'%',height:h*100+'%'});
    drag.el.className='box '+(p.fx>=drag.x0?'win':'cross'); drag.moved = w>.004||h>.004;
    tip.style.display=drag.moved?'block':'none'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
    tip.textContent = p.fx>=drag.x0 ? 'Chọn vùng nằm trọn trong khung' : 'Chọn vùng chạm vào khung';
    return;
  }
  if (drag.t==='mvg'){
    let dx=p.fx-drag.p0.fx, dy=p.fy-drag.p0.fy;
    drag.ids.forEach(id=>{ const q=zoneById(id), o=drag.o[id]; dx=clamp(dx,-o.x,1-q.w-o.x); dy=clamp(dy,-o.y,1-q.h-o.y); });
    drag.ids.forEach(id=>{ const q=zoneById(id), o=drag.o[id]; q.x=o.x+dx; q.y=o.y+dy; capNhatDom(q); });
    drag.moved=true; return;
  }
  const z=zoneById(drag.id); if(!z) return;
  if (drag.t==='new'){
    z.x=Math.min(drag.x0,p.fx); z.y=Math.min(drag.y0,p.fy); z.w=Math.abs(p.fx-drag.x0); z.h=Math.abs(p.fy-drag.y0);
  } else if (drag.t==='none'){ return;
  } else if (drag.t==='mv'){
    const dx=p.fx-drag.p0.fx, dy=p.fy-drag.p0.fy;
    z.x=clamp(drag.o.x+dx,0,1-z.w); z.y=clamp(drag.o.y+dy,0,1-z.h);
  } else {
    const o=drag.o, h=drag.h; let x1=o.x, y1=o.y, x2=o.x+o.w, y2=o.y+o.h;
    if (h.includes('w')) x1=clamp(p.fx,0,x2-MIN);
    if (h.includes('e')) x2=clamp(p.fx,x1+MIN,1);
    if (h.includes('n')) y1=clamp(p.fy,0,y2-MIN);
    if (h.includes('s')) y2=clamp(p.fy,y1+MIN,1);
    z.x=x1; z.y=y1; z.w=x2-x1; z.h=y2-y1;
  }
  drag.moved=true;
  capNhatDom(z);
  tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px';
  tip.textContent = `${tenVung(z)} · ${Math.round(z.w*100)}% × ${Math.round(z.h*100)}%  (${Math.round(z.w*210)} × ${Math.round(z.h*297)} mm)`;
});
window.addEventListener('mouseup', e=>{
  if (!drag) return;
  if (drag.t==='box'){
    if (!drag.moved){ if (!drag.add) chon([]); }
    else {
      const p=viTri(e,drag.no), x1=Math.min(drag.x0,p.fx), y1=Math.min(drag.y0,p.fy), x2=Math.max(drag.x0,p.fx), y2=Math.max(drag.y0,p.fy);
      const window_ = p.fx>=drag.x0;
      const trung = S.zones.filter(z=>apDung(z,drag.no)).filter(z=> window_
        ? (z.x>=x1 && z.y>=y1 && z.x+z.w<=x2 && z.y+z.h<=y2)
        : (z.x<x2 && z.x+z.w>x1 && z.y<y2 && z.y+z.h>y1)).map(z=>z.id);
      chon(drag.add ? [...S.selIds, ...trung] : trung);
    }
    drag=null; tip.style.display='none'; render(); return;
  }
  const z=drag.id?zoneById(drag.id):null;
  if (drag.t==='new' && z && (z.w<MIN || z.h<MIN)){ S.zones=S.zones.filter(v=>v!==z); S.undo.pop(); chon([]); }
  else if (!drag.moved) S.undo.pop();
  else nhayCapNhat();
  drag=null; tip.style.display='none'; render();
});

/* ---------- bấm ---------- */
app.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if (S.ctx && !e.target.closest('.ctx')){ S.ctx=null; if(!el){ render(); return; } }
  if (S.menu && !e.target.closest('.mbtn') && !e.target.closest('.cb') && !e.target.closest('[data-act=runMenu]')){ S.menu=null; if(!el){ render(); return; } }
  if (!el) return;
  if ((el.dataset.act==='cfgClose'||el.dataset.act==='noDel'||el.dataset.act==='helpClose') && e.target.closest('[data-stop]') && el.closest('[data-stop]')===null) return;
  if (el.tagName==='A') e.preventDefault();
  const a=el.dataset.act, v=el.dataset.v;
  if (a.startsWith('cv:')){ const k=a.slice(3); S.cv[k]=!S.cv[k]; render(); return; }
  const z=S.ctx?zoneById(S.ctx.id):null;
  switch(a){
    case 'vung': batTatGoc(el.dataset.src, v); break;
    case 'draw': S.draw = S.draw===v ? null : v; if (S.draw){ chon([]); if (S.loc!=='vodoi' || S.draw!=='xoa') S.loc='tung'; } S.ctx=null; break;
    case 'collapse': S.collapsed=!S.collapsed; break;
    case 'menu': S.menu = S.menu===v ? null : v; break;
    case 'combo': S.menu = S.menu==='combo' ? null : 'combo'; break;
    case 'stPick': S.stFilter=v; S.pgFilter=''; S.menu=null; break;
    case 'cfg': S.cfg=true; S.menu=null; break;
    case 'cfgClose': S.cfg=false; break;
    case 'loc': {
      S.loc=v;
      const z = !S.draw && S.selIds.length===1 ? zoneById(S.zsel) : null;
      if (z){ const moi = v==='all'||v==='le'||v==='chan' ? v : (typeof z.pages==='number' ? z.pages : S.page);
        const vd = v==='vodoi' && z.kind==='xoa' && z.src==='ve';
        if (moi!==z.pages || vd!==!!z.vodoi){ luuHoanTac(); z.pages=moi; z.vodoi=vd; nhayCapNhat(); } }
      break; }
    case 'nhanDien': if (S.model.st==='ready') S.nhanDien=!S.nhanDien; break;
    case 'modelLoad': e.preventDefault(); taiMoHinh(); break;
    case 'modelFile': e.preventDefault(); S.model={st:'verify', p:100}; render(); setTimeout(()=>{ S.model={st:'ready', p:100}; S.nhanDien=true; render(); }, 600); return;
    case 'modelCancel': e.preventDefault(); clearInterval(tTai); S.model={st:'none', p:0}; break;
    case 'cvReset': S.nhanDien = S.model.st==='ready'; S.cv={netDen:true, doXanh:true, dpi:'Gốc', nen:'90%', denTrang:false, nenTrang:false, ghiDe:false, render10:true, tuLuu:0, cuonCung:true}; S.thumbs=true; S.hideDich=false; S.view='lien'; break;
    case 'open': S.opened=true; S.motFile=false; S.sel=0; S.page=1; S.menu=null; break;
    case 'listToggle': S.listUser = !listMoRong(); break;
    case 'openFile': S.opened=true; S.motFile=true; S.sel=0; S.page=1; S.menu=null; break;
    case 'pickOut': S.outDir='D:/Ket_qua/Xoa_ghim'; break;      // prototype: giả lập đã chọn trong hộp chọn thư mục
    case 'outReset': S.outDir=null; break;
    case 'close': S.opened=false; S.motFile=false; S.listUser=null; S.menu=null; S.page=1; S.filter=''; S.pgFilter=''; S.stFilter='all'; S.advAp=null; chon([]); break;
    case 'home': S.home=true; S.menu=null; break;
    case 'backXg': S.home=false; break;
    case 'thumbs': S.thumbs=!S.thumbs; break;
    case 'dich': S.hideDich=!S.hideDich; break;
    case 'all': { const on=!S.files.every(f=>f.checked); S.files.forEach(f=>f.checked=on); break; }
    case 'sort': if (S.sortBy===v) S.desc=!S.desc; else { S.sortBy=v; S.desc=false; } break;
    case 'check': e.stopPropagation(); S.files[+v].checked=!S.files[+v].checked; break;
    case 'pick': if(e.target.matches('input')) return; S.sel=+v; S.page=1; break;
    case 'adv': S.advOpen=!S.advOpen; break;
    case 'advOn': S.advOn=!S.advOn; break;
    case 'size': S.adv.sizes[v]=!S.adv.sizes[v]; break;
    case 'advOri': S.adv[v]=!S.adv[v]; break;
    case 'advApply': S.advAp=JSON.parse(JSON.stringify(S.adv)); S.advOn=true; break;
    case 'advClear': S.advAp=null; break;
    case 'prevFile': S.sel=Math.max(0,S.sel-1); S.page=1; break;
    case 'nextFile': S.sel=Math.min(S.files.length-1,S.sel+1); S.page=1; break;
    case 'page': denTrang(+v); return;
    case 'prevPage': denTrang(S.page-1); return;
    case 'nextPage': denTrang(S.page+1); return;
    case 'fit': S.zoom=v; render(); render(); if (S.view==='lien') cuonToiTrang(S.page); return;
    case 'zoom': S.zoom=clamp(Math.round(zoomNow())+(+v),20,150); render(); if (S.view==='lien') cuonToiTrang(S.page); return;
    case 'delSel': hoiXoaHetVe(); break;
    case 'okDel': if (S.confirm) xoaIds(S.confirm.ids); S.confirm=null; break;
    case 'noDel': S.confirm=null; break;
    case 'ctxDel': if (z) xoaVung(z.id); S.ctx=null; break;
    case 'undo': hoanTac(); S.ctx=null; break;
    case 'ctxKind': if (z){ luuHoanTac(); z.kind = z.kind==='xoa'?'bao':'xoa'; if (z.kind==='bao') z.vodoi=false; nhayCapNhat(); } S.ctx=null; break;
    case 'ctxDup': if (z){ luuHoanTac(); const n=Object.assign({}, z, {id:nextId++, src:'ve', key:null, x:clamp(z.x+.03,0,1-z.w), y:clamp(z.y+.03,0,1-z.h)}); S.zones.push(n); chon([n.id]); nhayCapNhat(); } S.ctx=null; break;
    case 'ctxPages': if (z){ luuHoanTac(); z.pages = /^\d+$/.test(v) ? +v : v; nhayCapNhat(); } S.ctx=null; break;
    case 'clearDrawn': luuHoanTac(); S.zones=S.zones.filter(v=>v.src!=='ve'); chon(S.selIds.filter(id=>zoneById(id))); S.ctx=null; nhayCapNhat(); break;
    case 'run': batDauChay(false); return;
    case 'runAll': batDauChay(true); return;
    case 'runMenu': S.menu = S.menu==='run' ? null : 'run'; break;
    case 'runStop': if (S.run){ S.run.st='dung'; clearInterval(tChay); } break;
    case 'runClose': S.run=null; break;
    case 'help': S.help=true; S.menu=null; break;
    case 'helpClose': S.help=false; break;
    case 'noop': break;
    default: return;
  }
  render();
});

/* Thanh trượt Rộng / Cao / Ngưỡng: sửa vùng đang chọn (giữ mép đang bám cạnh trang) */
app.addEventListener('pointerdown', e=>{ if (e.target.dataset && e.target.dataset.range && S.zsel && S.selIds.length===1) luuHoanTac(); });
app.addEventListener('input', e=>{
  const k=e.target.dataset.range;
  if (k){
    const z=S.selIds.length===1?zoneById(S.zsel):null; if(!z) return; const v=+e.target.value;
    veSlider(e.target);
    if (k==='ng'){ z.ng=v; return; }
    if (k==='rong'){ const phai = z.x+z.w>=.999 && z.x>0; z.w=v/100; z.x = phai ? 1-z.w : clamp(z.x,0,1-z.w); }
    if (k==='cao'){ const duoi = z.y+z.h>=.999 && z.y>0; z.h=v/100; z.y = duoi ? 1-z.h : clamp(z.y,0,1-z.h); }
    capNhatDom(z); return;
  }
  if (e.target.id==='filter'){ S.filter=e.target.value; render(); }
  else if (e.target.id==='pgFilter'){ S.pgFilter=e.target.value; render(); }
  else if (e.target.id==='advRange'){ S.adv.range=e.target.value; }
});
app.addEventListener('change', e=>{
  if (e.target.id==='pgNo'){ denTrang(Math.round(+e.target.value)||1); return; }
  if (e.target.dataset.range){ nhayCapNhat(); render(); return; }
  // ô số cạnh thanh trượt: gõ giá trị rồi Enter / rời ô
  if (e.target.dataset.num){ const sl=document.querySelector(`[data-range="${e.target.dataset.num}"]`); const v=clamp(Math.round(+e.target.value||0),+sl.min,+sl.max);
    luuHoanTac(); sl.value=v; sl.dispatchEvent(new Event('input',{bubbles:true})); nhayCapNhat(); render(); return; }
  if (e.target.dataset.cv){ S.cv[e.target.dataset.cv]=e.target.value; return; }
  if (e.target.dataset.cvnum){ S.cv.tuLuu=Math.max(0,Math.round(+e.target.value||0)); render(); return; }
  const k=e.target.dataset.sel; if(!k) return;
  if (k==='zsel') chon(e.target.value ? [+e.target.value] : []);
  else if (k==='zoom'){ if (e.target.value) S.zoom = +e.target.value; render(); if (S.view==='lien') cuonToiTrang(S.page); return; }
  else if (k==='view'){ S.view=e.target.value; render(); if (S.view==='lien') cuonToiTrang(S.page); return; }
  else if (k==='outMode') S.outMode = e.target.value;
  else if (k==='stFilter') S.stFilter = e.target.value;
  render();
});

/* Phím: Delete xoá vùng chọn, Ctrl/Cmd+Z hoàn tác, Esc thôi vẽ / đóng menu */
window.addEventListener('keydown', e=>{
  if (e.target.matches && e.target.matches('input[type=text],input:not([type]),input[data-num],select')) return;
  if (S.confirm){ if (e.key==='Enter'){ e.preventDefault(); xoaIds(S.confirm.ids); S.confirm=null; render(); } else if (e.key==='Escape'){ S.confirm=null; render(); } return; }
  if ((e.key==='Delete'||e.key==='Backspace') && S.selIds.length){ e.preventDefault();
    const ids=S.selIds.filter(id=>{ const z=zoneById(id); return z && z.src==='ve'; });
    if (ids.length){ xoaIds(ids); baoNhanh(`Đã xoá ${ids.length} vùng · Ctrl+Z để hoàn tác`); }
    else baoNhanh('Vùng cạnh / góc: bỏ bằng cách bấm lại trên biểu tượng');
    render(); }
  else if (e.key==='F1'){ e.preventDefault(); S.help=true; render(); }
  else if (S.opened && !S.confirm && (e.key==='PageDown'||e.key==='PageUp')){ e.preventDefault(); denTrang(S.page+(e.key==='PageDown'?1:-1)); }
  else if (S.opened && !e.ctrlKey && !e.metaKey && (e.key==='+'||e.key==='-')){ S.zoom=clamp(Math.round(zoomNow())+(e.key==='+'?10:-10),20,150); render(); if (S.view==='lien') cuonToiTrang(S.page); }
  else if (S.opened && e.key==='='){ S.zoom='fitW'; render(); render(); }
  else if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a' && S.opened){ e.preventDefault(); chon(S.zones.map(z=>z.id)); render(); }
  else if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); hoanTac(); render(); }
  else if (e.key==='Escape'){ if (!S.draw && !S.ctx && !S.menu && !S.cfg && !S.help) chon([]); S.draw=null; S.ctx=null; S.menu=null; S.cfg=false; S.help=false; render(); }
});

if (location.hash.startsWith('#mo')) S.opened=true;
if (location.hash.endsWith('-tep')) S.menu='tep';
if (location.hash.endsWith('-cfg')) S.cfg=true;
render(); render();
window.addEventListener('resize', ()=>{ if(typeof S.zoom!=='number') apTyLe(); });
</script>
