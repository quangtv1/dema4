[package]
name = "dema4_rs"
version = "1.0.0"
edition = "2021"
description = "Đếm trang A4 và tách văn bản PDF scan (Giải pháp số Sao Mai)"

# Tên file chạy / tên tiến trình: dema4_saomai (dema4_saomai.exe trên Windows); tiêu đề cửa sổ không đổi
[[bin]]
name = "dema4_saomai"
path = "src/main.rs"

[dependencies]
# Chỉ cần đọc PDF: tắt các định dạng không dùng tới cho nhẹ. Giữ 14 font cơ bản (Helvetica, Times…)
# vì PDF chữ không nhúng font và widget chữ ký chưa có appearance sẽ không mở được nếu thiếu
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
rayon = "1.12"
eframe = "0.37"
rfd = "0.17"
egui_extras = { version = "0.37", features = ["svg"] }
ureq = "3.5.0"
whoami = "2.1.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
mac_address = "1.2.1"
jwalk = "0.9.0"
# Trạm license: kiểm chữ ký RSA câu trả lời + JSON
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"
serde_json = "1"
# Mã lần chạy / nonce license (nguồn ngẫu nhiên của hệ điều hành)
getrandom = "0.2"
# Tách văn bản: đọc mã vạch tờ index (zxing-cpp, dựng từ nguồn C++) + mô hình hướng trang (ONNX Runtime liên kết tĩnh)
zxing-cpp = { version = "0.5.3", features = ["bundled"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "download-binaries"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
calamine = { version = "0.37.0", features = ["dates"] }
encoding_rs = "0.8.44"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Registry"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
# Tạo cặp khoá RSA trong test chữ ký trạm license
rand_core = { version = "0.6", features = ["getrandom"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
