<!doctype html>
<!-- Spike S3: dựng trang 1 của ../out/s3-font.pdf bằng pdf.js để chụp ảnh kiểm tra hiển thị. -->
<meta charset="utf-8">
<title>dang ve</title>
<body style="margin:0;background:#fff">
<canvas id="c"></canvas>
<pre id="log"></pre>
<script type="module">
  const log = (text) => { document.getElementById('log').textContent += text + '\n'; };
  try {
    const pdfjs = await import('./node_modules/pdfjs-dist/build/pdf.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = './node_modules/pdfjs-dist/build/pdf.worker.mjs';
    // Mặc định vẽ file của spike S3; truyền ?pdf=<đường dẫn> để vẽ file khác.
    const url = new URLSearchParams(location.search).get('pdf') ?? '../out/s3-font.pdf';
    const doc = await pdfjs.getDocument({ url }).promise;
    const page = await doc.getPage(1);
    const viewport = page.getViewport({ scale: 2 });
    const canvas = document.getElementById('c');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvas, canvasContext: canvas.getContext('2d'), viewport }).promise;
    document.title = 'xong';
  } catch (error) {
    log('LOI: ' + error);
  }
</script>
</body>
